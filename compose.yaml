services:
  vault:
    image: hashicorp/vault:latest
    container_name: vault_server
    ports:
      - "8200:8200"
    volumes:
      - ./vault/config:/vault/config:Z
      - ./vault/data:/vault/data:Z
    environment:
      - VAULT_ADDR=http://127.0.0.1:8200
    # Im Rootless-Modus erlaubt Podman standardmäßig oft kein IPC_LOCK. 
    # Wir lassen es weg, Vault gibt beim Start nur eine Warnung aus (völlig okay für Entwicklung/Test).
    command: server -config=/vault/config/vault-config.hcl